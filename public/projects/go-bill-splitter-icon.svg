<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Go Bill Splitter Web Application</text>
  <text x="250" y="45" text-anchor="middle" fill="#4ecdc4" font-family="Arial, sans-serif" font-size="12">Gin Framework + GORM + Go Templates</text>
  
  <!-- User Input -->
  <rect x="20" y="70" width="100" height="60" rx="8" fill="#00ADD8" stroke="#ffffff" stroke-width="1"/>
  <text x="70" y="90" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">User Input</text>
  <text x="70" y="105" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Bill Details</text>
  <text x="70" y="118" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Participants</text>
  
  <!-- Arrow 1 -->
  <path d="M125 100 L155 100" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Gin Router -->
  <rect x="160" y="70" width="80" height="60" rx="8" fill="#ff6b6b" stroke="#ffffff" stroke-width="1"/>
  <text x="200" y="90" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Gin Router</text>
  <text x="200" y="105" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">HTTP Handlers</text>
  <text x="200" y="118" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Middleware</text>
  
  <!-- Arrow 2 -->
  <path d="M245 100 L275 100" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Business Logic -->
  <rect x="280" y="70" width="100" height="60" rx="8" fill="#9b59b6" stroke="#ffffff" stroke-width="1"/>
  <text x="330" y="85" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Business Logic</text>
  <text x="330" y="100" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Split Calculation</text>
  <text x="330" y="113" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Share Distribution</text>
  <text x="330" y="126" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">User Management</text>
  
  <!-- Arrow down from Business Logic -->
  <path d="M330 135 L330 165" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- GORM Database -->
  <rect x="280" y="170" width="100" height="60" rx="8" fill="#f39c12" stroke="#ffffff" stroke-width="1"/>
  <text x="330" y="190" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">GORM ORM</text>
  <text x="330" y="205" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Data Persistence</text>
  <text x="330" y="218" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Models and Relations</text>
  
  <!-- Arrow down from GORM -->
  <path d="M330 235 L330 265" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Database -->
  <rect x="280" y="270" width="100" height="50" rx="8" fill="#2c3e50" stroke="#ffffff" stroke-width="1"/>
  <text x="330" y="290" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Database</text>
  <text x="330" y="305" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Bills and Users</text>
  
  <!-- Arrow back up -->
  <path d="M275 200 L245 200" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Go Templates -->
  <rect x="145" y="170" width="90" height="60" rx="8" fill="#27ae60" stroke="#ffffff" stroke-width="1"/>
  <text x="190" y="190" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Go Templates</text>
  <text x="190" y="205" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Server-side</text>
  <text x="190" y="218" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">HTML Rendering</text>
  
  <!-- Arrow from Templates to Output -->
  <path d="M140 200 L110 200" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Output -->
  <rect x="20" y="170" width="90" height="60" rx="8" fill="#e74c3c" stroke="#ffffff" stroke-width="1"/>
  <text x="65" y="190" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Web Interface</text>
  <text x="65" y="205" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Split Results</text>
  <text x="65" y="218" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">User Dashboard</text>
  
  <!-- Technology labels -->
  <rect x="410" y="80" width="70" height="20" rx="10" fill="#00ADD8"/>
  <text x="445" y="93" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Go/Gin</text>
  
  <rect x="410" y="110" width="70" height="20" rx="10" fill="#f39c12"/>
  <text x="445" y="123" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">GORM</text>
  
  <rect x="410" y="140" width="70" height="20" rx="10" fill="#27ae60"/>
  <text x="445" y="153" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Templates</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ecdc4"/>
    </marker>
  </defs>
</svg>