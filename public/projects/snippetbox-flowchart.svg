<svg width="520" height="380" viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="520" height="380" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="260" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SnippetBox Web Application</text>
  <text x="260" y="45" text-anchor="middle" fill="#4ecdc4" font-family="Arial, sans-serif" font-size="12">Go net/http + SCS Sessions + Secure Authentication</text>
  
  <!-- User Request -->
  <rect x="20" y="70" width="90" height="50" rx="8" fill="#00ADD8" stroke="#ffffff" stroke-width="1"/>
  <text x="65" y="90" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">User Request</text>
  <text x="65" y="105" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">HTTP Client</text>
  
  <!-- Arrow 1 -->
  <path d="M115 95 L145 95" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- HTTP Router -->
  <rect x="150" y="70" width="90" height="50" rx="8" fill="#ff6b6b" stroke="#ffffff" stroke-width="1"/>
  <text x="195" y="90" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">HTTP Router</text>
  <text x="195" y="105" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">net/http mux</text>
  
  <!-- Arrow 2 -->
  <path d="M245 95 L275 95" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Middleware Chain -->
  <rect x="280" y="70" width="90" height="50" rx="8" fill="#9b59b6" stroke="#ffffff" stroke-width="1"/>
  <text x="325" y="85" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Middleware</text>
  <text x="325" y="100" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Security Headers</text>
  <text x="325" y="113" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Logging and Recovery</text>
  
  <!-- Arrow down -->
  <path d="M325 125 L325 155" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Authentication -->
  <rect x="280" y="160" width="90" height="50" rx="8" fill="#e67e22" stroke="#ffffff" stroke-width="1"/>
  <text x="325" y="180" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Authentication</text>
  <text x="325" y="195" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Secure Patterns</text>
  
  <!-- Arrow to Session -->
  <path d="M275 185 L245 185" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Session Management -->
  <rect x="150" y="160" width="90" height="50" rx="8" fill="#f39c12" stroke="#ffffff" stroke-width="1"/>
  <text x="195" y="180" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">SCS Sessions</text>
  <text x="195" y="195" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Session Store</text>
  
  <!-- Arrow down from auth -->
  <path d="M325 215 L325 245" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Handlers -->
  <rect x="280" y="250" width="90" height="60" rx="8" fill="#27ae60" stroke="#ffffff" stroke-width="1"/>
  <text x="325" y="270" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Handlers</text>
  <text x="325" y="285" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Create Snippet</text>
  <text x="325" y="298" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">View Snippet</text>
  
  <!-- Arrow to Database -->
  <path d="M375 280 L405 280" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Database -->
  <rect x="410" y="250" width="90" height="60" rx="8" fill="#2c3e50" stroke="#ffffff" stroke-width="1"/>
  <text x="455" y="270" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Database</text>
  <text x="455" y="285" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Snippets</text>
  <text x="455" y="298" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Users</text>
  
  <!-- Arrow back from handlers -->
  <path d="M275 280 L245 280" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Template Engine -->
  <rect x="150" y="250" width="90" height="60" rx="8" fill="#8e44ad" stroke="#ffffff" stroke-width="1"/>
  <text x="195" y="270" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Templates</text>
  <text x="195" y="285" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">HTML Rendering</text>
  <text x="195" y="298" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Dynamic Content</text>
  
  <!-- Arrow to Response -->
  <path d="M145 280 L115 280" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- HTTP Response -->
  <rect x="20" y="250" width="90" height="60" rx="8" fill="#e74c3c" stroke="#ffffff" stroke-width="1"/>
  <text x="65" y="270" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">HTTP Response</text>
  <text x="65" y="285" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">HTML Pages</text>
  <text x="65" y="298" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">JSON API</text>
  
  <!-- Security Features Box -->
  <rect x="20" y="330" width="480" height="40" rx="8" fill="#34495e" stroke="#4ecdc4" stroke-width="1"/>
  <text x="30" y="345" fill="#4ecdc4" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Security Features:</text>
  <text x="30" y="358" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">CSRF Protection • Secure Headers • Session Security • Input Validation • SQL Injection Prevention</text>
  
  <!-- Technology labels -->
  <rect x="430" y="80" width="70" height="18" rx="9" fill="#00ADD8"/>
  <text x="465" y="92" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">net/http</text>
  
  <rect x="430" y="105" width="70" height="18" rx="9" fill="#f39c12"/>
  <text x="465" y="117" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">SCS</text>
  
  <rect x="430" y="130" width="70" height="18" rx="9" fill="#e67e22"/>
  <text x="465" y="142" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">bcrypt</text>
  
  <rect x="430" y="155" width="70" height="18" rx="9" fill="#8e44ad"/>
  <text x="465" y="167" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Templates</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ecdc4"/>
    </marker>
  </defs>
</svg>